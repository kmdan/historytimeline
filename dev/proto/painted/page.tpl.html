<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#222}canvas{display:block}</style>
<canvas id="c" width="%W%" height="%H%"></canvas>
<script>
const W=%W%,H=%H%,RIV=%RIV%,STY='%STYLE%',SH=STY==='shelton';
const load=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=s});
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hx=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
const A3=c=>typeof c==='string'?hx(c):c;
const mix=(a,b,t,j=0)=>{a=A3(a);b=A3(b);return a.map((v,i)=>Math.max(0,Math.min(255,(v+(b[i]-v)*t)*(1+j))))};
const css=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
function dab(x,cx,cy,rx,ry,ang,col,a){x.fillStyle=css(col,a);x.beginPath();x.ellipse(cx,cy,Math.max(.15,rx),Math.max(.15,ry),ang,0,7);x.fill()}
const TREE={con:1,scon:1,dec:1,rf:1,aca:1};
// type ids: 0 sea 1 lake 2 ice 3 farm 4 rain 5 savanna 6 desert 7 steppe 8 med 9 temp 10 taiga 11 tundra 12 mstep
const GN={3:'farm',4:'rain',5:'savanna',6:'desert',7:'steppe',8:'med',9:'temp',10:'taiga',11:'tundra',12:'mstep'};
const DENS=SH?{}:{7:[['dec',.012]],8:[['olv',.035]],6:[['dune',.22]],5:[['aca',.09]],3:[['dec',.02]],12:[['sh',.01]]};
(async()=>{
const [bi,mi,ci]=await Promise.all([load('%BASE%'),load('%META%'),load('%CLIM%')]);
const c=document.getElementById('c'),x=c.getContext('2d');
const grab=im=>{const o=document.createElement('canvas');o.width=W;o.height=H;const g=o.getContext('2d');g.drawImage(im,0,0);return g.getImageData(0,0,W,H).data};
const B=grab(bi),M=grab(mi),C=grab(ci);x.drawImage(bi,0,0);
const r=rng(7),idx=(X,Y)=>((Math.min(H-1,Math.max(0,Y|0)))*W+Math.min(W-1,Math.max(0,X|0)))*4;
const at=(X,Y)=>{const k=idx(X,Y);return{t:M[k],cl:M[k+1]/255,e:M[k+2],c:[B[k],B[k+1],B[k+2]],cold:C[k]/255,dry:C[k+1]/255}};
const isW=t=>t<2;
// oil strokes on land, laid along the contours (perpendicular to the light gradient)
const lum=(X,Y)=>{const k=idx(X,Y);return B[k]*.3+B[k+1]*.59+B[k+2]*.11};
for(let i=0;i<(SH?0:W*H/9);i++){const X=r()*W,Y=r()*H,a=at(X,Y);if(isW(a.t))continue;const gx=lum(X+2,Y)-lum(X-2,Y),gy=lum(X,Y+2)-lum(X,Y-2);const an=Math.atan2(gy,gx)+Math.PI/2+(r()-.5)*.5;
const l=2+r()*4;x.strokeStyle=css(mix(a.c,r()<.5?[0,0,0]:[255,245,220],.08+r()*.08),.28);x.lineWidth=.8+r()*1.2;x.beginPath();x.moveTo(X-Math.cos(an)*l/2,Y-Math.sin(an)*l/2);x.lineTo(X+Math.cos(an)*l/2,Y+Math.sin(an)*l/2);x.stroke()}
// water chop + glitter
x.lineCap='round';
for(let i=0;i<(SH?0:W*H/70);i++){const X=r()*W,Y=r()*H,a=at(X,Y);if(!isW(a.t)||a.e<25)continue;const l=3+r()*6,an=-.06+(r()-.5)*.1,lite=r()<.6;
x.strokeStyle=lite?css(mix(a.c,[220,232,228],.18),a.t===1?.14:.2):css(mix(a.c,[0,0,0],.25),.24);x.lineWidth=.5+r()*.4;x.beginPath();x.moveTo(X-Math.cos(an)*l/2,Y-Math.sin(an)*l/2);x.quadraticCurveTo(X,Y-.5,X+Math.cos(an)*l/2,Y+Math.sin(an)*l/2);x.stroke()}
// rivers
const ro=document.createElement('canvas');ro.width=W;ro.height=H;const rx=ro.getContext('2d');rx.strokeStyle='#000';
for(const R of RIV){const pts=R.p,path=()=>{x.beginPath();x.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;x.quadraticCurveTo(pts[i][0],pts[i][1],mx,my)}const L=pts[pts.length-1];x.lineTo(L[0],L[1])};
x.lineJoin='round';path();x.strokeStyle=SH?'rgba(60,80,50,.25)':'rgba(30,36,24,.35)';x.lineWidth=R.w+1.2;x.stroke();path();x.strokeStyle=SH?'rgba(70,130,190,.85)':'rgba(52,92,104,.75)';x.lineWidth=R.w;x.stroke();
path();x.strokeStyle=SH?'rgba(200,228,245,.5)':'rgba(150,180,180,.35)';x.lineWidth=R.w*.3;x.stroke();rx.lineCap='round';rx.lineJoin='round';rx.beginPath();R.p.forEach(([a,b],i)=>i?rx.lineTo(a,b):rx.moveTo(a,b));rx.lineWidth=R.w+1.6;rx.stroke()}
const RM=rx.getImageData(0,0,W,H).data;
// symbols
const its=[],ri=rng(99),gx=6,gy=5.5;
for(let Y=2;Y<H+4;Y+=gy)for(let X=2;X<W;X+=gx){const px=X+(ri()-.5)*gx*.8,py=Y+(ri()-.5)*gy*.8,a=at(px,py),L=DENS[a.t];if(!L)continue;
const up=at(px,py-4);if(isW(up.t)||up.t===2||a.e>196||RM[idx(px,py)+3]>40||RM[idx(px,py-3)+3]>40)continue;
let q=ri(),k=null;for(const[kk,pr]of L){const pp=TREE[kk]&&a.t!==4?Math.min(1,pr*(.25+a.cl*1.05)):pr;if(q<pp){k=kk;break}q-=pp}
if(k==='con'&&a.cold>.75&&ri()<.5)k='scon';if(k)its.push({x:px,y:py,k,g:GN[a.t],s:(.8+ri()*.45)*7,r:ri(),cold:a.cold,dry:a.dry})}
its.sort((a,b)=>a.y-b.y);{const so=document.createElement('canvas');so.width=W;so.height=H;const sx=so.getContext('2d');for(const it of its)sym(sx,it,r);x.save();x.filter='brightness(0.62) saturate(0.75)';x.drawImage(so,0,0);x.restore()}
// labels
x.textAlign='center';x.textBaseline='middle';
const lab=(t,lo,la,sz,col,sp=2,it=1)=>{const X=(lo-(%LON0%))*%PPD%,Y=((%LAT1%)-la)*%PPD%;if(X<0||X>W||Y<0||Y>H)return;x.font=`${it?'italic ':''}400 ${sz}px Georgia, 'Times New Roman', serif`;x.fillStyle=col;
x.save();x.translate(X,Y);let s='';const ch=[...t];const w=ch.reduce((a,c)=>a+x.measureText(c).width+sp,0);let cx=-w/2;
x.lineWidth=3;x.strokeStyle=SH?'rgba(255,255,250,.55)':'rgba(12,16,18,.5)';for(const c of ch){x.strokeText(c,cx+x.measureText(c).width/2,0);cx+=x.measureText(c).width+sp}cx=-w/2;for(const c of ch){x.fillText(c,cx+x.measureText(c).width/2,0);cx+=x.measureText(c).width+sp}x.restore()};
const SEAC=SH?'#2f5f8f':'#b9c9c6';lab('ATLANTIC OCEAN',-6.5,45.5,17,SEAC,5);lab('NORTH SEA',3.2,56.3,14,SEAC,4);lab('MEDITERRANEAN SEA',17.5,35.3,16,SEAC,5);lab('BLACK SEA',34.5,43.3,13,SEAC,3);lab('BALTIC',19.5,57.5,12,SEAC,3);
lab('Alps',10.3,46.2,15,(SH?'#3b3020':'#d9ccad'),2);lab('Pyrenees',0.5,42.2,13,(SH?'#3b3020':'#d9ccad'),1);lab('Carpathians',24.5,47.9,13,(SH?'#3b3020':'#d9ccad'),1);lab('Anatolia',33,39.2,15,(SH?'#3b3020':'#d9ccad'),2);lab('Doggerland (drowning)',3.5,54.6,11,SEAC,1);
lab('first farmers',22.5,40.6,12,(SH?'#6a3a10':'#e2c48e'),1);lab('AEGEAN SEA',25,38.6,13,SEAC,3);lab('Danube',22.5,44.3,11,(SH?'#2f5f8f':'#a9c0c4'),1);lab('Thessaly',22.3,39.6,11,(SH?'#3b3020':'#d9ccad'),1);
x.font="400 22px Georgia, serif";x.textAlign='left';x.fillStyle=SH?'rgba(250,248,240,.85)':'rgba(22,26,30,.78)';x.fillRect(16,H-56,560,40);x.fillStyle=SH?'#2a2418':'#e6dcc4';x.fillText('Europe · %YEAR%',28,H-36);
x.font="italic 400 12px Georgia, serif";x.fillText('painted from Beyer 2020 · De Groeve 2022 · farming spread · relief',250,H-36);
document.title='done';
})();
function sym(x,it,r){const s=it.s,px=it.x,py=it.y,A=.92,cold=it.cold,dry=it.dry,shc=[60,64,48];x.lineCap='round';
const sh=(w,h)=>{dab(x,px+s*.35,py-s*.04,s*w,s*h,0,shc,.22);dab(x,px+s*.5,py,s*w*.6,s*h*.6,0,shc,.14)};
const gD=mix(mix('#2a432f','#384a47',cold),'#3b3f2c',dry*.3),gL=mix(mix('#56764f','#6f847a',cold),'#7a7a55',dry*.3);
const dD=mix('#3c572c','#5a603a',dry),dL=mix('#8aa462','#aaa66a',dry);
const grA=mix(mix('#768a45','#9a8a4f',dry),'#7b7a5a',cold*.5),grB=mix(mix('#a3ae5f','#c6b06c',dry),'#a6a184',cold*.5);
const shrub={tundra:['#6b6a45','#918b5d'],mstep:['#76703f','#a39662'],med:['#66704c','#a0a67c'],savanna:['#5c6a3a','#93a05e'],steppe:['#76703f','#a39662']}[it.g]||['#5c6a3a','#93a05e'];
const crown=(cx,cy,R,n,d0,d1,hl)=>{dab(x,cx+R*.15,cy+R*.15,R*1.02,R*.9,0,mix(d0,[0,0,0],.25),A);for(let k=0;k<n;k++){const a=r()*7,dd=Math.sqrt(r())*R*.85,dx=Math.cos(a)*dd,dy=Math.sin(a)*dd*.85,lit=Math.max(0,Math.min(1,.5-(dx+dy)/(R*1.8)));dab(x,cx+dx,cy+dy,R*(.32+r()*.22),R*(.27+r()*.18),r()*3,mix(d0,d1,lit,(r()-.5)*.1),A)}if(hl)dab(x,cx-R*.38,cy-R*.42,R*.24,R*.18,0,mix(d1,'#fffbe8',.2),A*.8)};
switch(it.k){
case'con':case'scon':{sh(.45,.15);for(let k=0;k<11;k++){const t=k/10,w=s*.34*Math.pow(1-t,.85)+s*.06,cy=py-s*.22-t*s*1.25,jj=(r()-.5)*s*.06;dab(x,px+jj,cy,w,s*.11,(r()-.5)*.2,mix(gD,gD,0,(r()-.5)*.12+(it.r-.5)*.15),A);dab(x,px-w*.4+jj,cy-s*.03,w*.48,s*.065,-.2,mix(gL,gL,0,(r()-.5)*.1),A*.75);if(it.k==='scon'&&k%2===0)dab(x,px-w*.3,cy-s*.06,w*.55,s*.06,-.15,[240,243,240],.9)}dab(x,px,py-s*.1,s*.07,s*.12,0,[90,70,50],A);break}
case'dec':sh(.5,.16);dab(x,px,py-s*.25,s*.08,s*.28,0,[96,76,54],A);crown(px,py-s*.78,s*.36,14,dD,dL,1);break;
case'olv':{const q=s*.75;dab(x,px+q*.35,py-q*.04,q*.45,q*.14,0,shc,.2);dab(x,px,py-q*.2,q*.07,q*.22,0,[110,92,70],A);crown(px,py-q*.6,q*.36,9,'#5f6b4c','#a8ae88',1);break}
case'aca':{dab(x,px+s*.45,py,s*.7,s*.12,0,shc,.2);x.strokeStyle=css([100,80,58],A);x.lineWidth=s*.1;x.beginPath();x.moveTo(px,py);x.lineTo(px+s*.05,py-s*.55);x.lineTo(px-s*.3,py-s*.85);x.moveTo(px+s*.05,py-s*.55);x.lineTo(px+s*.32,py-s*.85);x.stroke();
dab(x,px+s*.05,py-s*.84,s*.58,s*.11,0,mix('#3f4f2a','#555a30',dry),A);for(let k=0;k<9;k++){const t=k/8-.5;dab(x,px+t*s*1.05+(r()-.5)*s*.15,py-s*.9-(1-4*t*t)*s*.08,s*.2,s*.08,0,mix(mix('#4f6233','#6a6a3a',dry),'#8c9a5c',r()*.5),A)}break}
case'rf':{const R=s*(.5+(it.r>.9?.25:0));dab(x,px+R*.5,py-R*.25,R*.95,R*.5,0,[20,34,18],.45);crown(px,py-R*.9,R,20,'#2a4626','#7a9e56',1);break}
case'sh':{dab(x,px+s*.2,py,s*.35,s*.1,0,shc,.18);for(let k=0;k<7;k++)dab(x,px+(r()-.5)*s*.5,py-s*.16-r()*s*.15,s*.15,s*.11,r()*3,mix(shrub[0],shrub[1],r()*.8),A);break}
case'tus':{for(let k=0;k<3;k++)dab(x,px+(k-1)*s*.15,py-s*.06,s*.12,s*.08,0,mix('#7b7a52','#a9a36e',r()),A);x.strokeStyle=css(hx('#8c8656'),A*.8);x.lineWidth=s*.06;x.beginPath();for(let k=-1;k<=1;k++){x.moveTo(px+k*s*.12,py-s*.08);x.lineTo(px+k*s*.22,py-s*.3)}x.stroke();break}
case'grass':for(let k=0;k<6;k++){const bx=px+(r()-.5)*s*.6,h=s*(.25+r()*.25);x.strokeStyle=css(mix(grA,grB,r()),A*.8);x.lineWidth=s*(.06+r()*.07);x.beginPath();x.moveTo(bx,py);x.quadraticCurveTo(bx+(r()-.5)*s*.2,py-h*.6,bx+(r()-.5)*s*.3,py-h);x.stroke()}break;
case'dune':{const w=s*1.2;for(let k=0;k<5;k++){const t=k/4;dab(x,px+w*.05+t*w*.15,py-s*.05+t*s*.13,w*(.55-.08*k),s*.16,-.12,mix('#b0864f','#c9a674',t),.4)}for(let k=0;k<4;k++)dab(x,px-w*.35+k*w*.18,py-s*.28+k*s*.1,w*.22,s*.06,-.25,[246,233,200],.65);break}
case'dead':x.strokeStyle=css([110,90,66],A);x.lineWidth=s*.1;x.beginPath();x.moveTo(px,py);x.lineTo(px,py-s*.6);x.moveTo(px,py-s*.35);x.lineTo(px-s*.25,py-s*.7);x.moveTo(px,py-s*.45);x.lineTo(px+s*.22,py-s*.75);x.stroke();break}}
</script>
